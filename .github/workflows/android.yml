name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      # Pinned to the v7/v5/v5 commits; Dependabot still proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: msc-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
