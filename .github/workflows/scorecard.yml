name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to the v7/v2.5.0/v4 commits; Dependabot still proposes updates.
      # v2.6.0 is blocked by a missing GHCR platform manifest; revert when fixed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Temporary: v2.6.0's GHCR index references a missing platform manifest
      # (sha256:7a627...), so the runner cannot pull the image. Pin the previous
      # release until the upstream image is repaired.
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
