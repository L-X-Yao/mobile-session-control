name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to the v7 commit; Dependabot still proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Offline checks
        run: npm test
      - name: Scenario suite
        run: npm run scenario
      - name: Build release artifacts
        run: node scripts/release-artifacts.mjs --out dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=--latest=false
          if [ "$(git tag --list 'v*' --sort=-v:refname | head -n 1)" = "$GITHUB_REF_NAME" ]; then
            latest=--latest
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/mobile-session-control-${GITHUB_REF_NAME#v}.tar.gz" \
            dist/SHA256SUMS dist/MANIFEST.sha256 dist/sbom.cdx.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE-NOTES.md \
            --verify-tag \
            "$latest"
