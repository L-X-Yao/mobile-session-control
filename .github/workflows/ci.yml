name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Offline checks
        run: npm test
      - name: Provider profiles
        run: npm run validate:profiles
      - name: Coverage
        if: matrix.node-version == 24
        run: npm run test:coverage
      - name: Demo slices
        run: |
          npm run demo:m1
          MSC_PROVIDER_PROFILE=examples/providers/deepseek.json npm run demo:m1
      - name: Short soak
        run: SOAK_MS=3000 SOAK_CONCURRENCY=4 node scripts/soak.mjs
