name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      # Pinned to the v7 commit; Dependabot still proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Offline checks
        run: npm test
      - name: Provider profiles
        run: npm run validate:profiles
      - name: Scenario suite
        run: npm run scenario
      - name: Coverage
        if: matrix.node-version == 24
        run: npm run test:coverage
      - name: Demo slices
        run: |
          npm run demo:m1
          MSC_PROVIDER_PROFILE=examples/providers/deepseek.json npm run demo:m1
      - name: Short soak
        run: SOAK_MS=3000 SOAK_CONCURRENCY=4 node scripts/soak.mjs
