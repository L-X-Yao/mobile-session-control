name: Soak

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fake-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to the v7 commit; Dependabot still proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Ten-minute fake-host soak
        run: SOAK_MS=600000 SOAK_CONCURRENCY=4 node scripts/soak.mjs
